<body>

    <div class="app-window">
        <div class="window-left">
            <div class="color-header-row">
                <div class="color-title">Set Color</div>
                <div class="color-swatch-box">
                    <div class="swatch-node white active" onclick="changeColor('#1a0b2e', this)"></div>
                    <div class="swatch-node dark" onclick="changeColor('#0d041a', this)"></div>
                </div>
            </div>
            
            <div class="qr-stage-container">
                <canvas id="qrCanvas"></canvas>
            </div>
            
            <button type="button" class="btn-download-trigger" onclick="triggerDownload()">Download</button>
        </div>

        <div class="window-right">
            <div class="logo-branding-area">
                <div class="logo-text-main">QRcode</div>
                <div class="logo-text-sub">generator</div>
            </div>

            <div class="form-input-group">
                <label class="field-label">Submit URL or text</label>
                <input type="text" class="text-input-field" id="qrDataInput" placeholder="Enter text or URL here" value="https://youtube.com">
            </div>

            <div class="form-input-group">
                <label class="field-label">Image size</label>
                <select class="text-input-field" id="qrSizeSelect" onchange="generateQRCode()" style="cursor: pointer;">
                    <option value="200">200x200</option>
                    <option value="300" selected>300x300</option>
                    <option value="400">400x400</option>
                    <option value="500">500x500</option>
                </select>
            </div>

            <button type="button" class="btn-generate-action" onclick="generateQRCode()">Generate</button>

            <a href="https://github.com" target="_blank" class="github-anchor-icon">
                <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 16 16" height="1em" width="1em" xmlns="http://w3.org"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
            </a>
        </div>
    </div>

    <script>
        let currentQRColor = "#1a0b2e";

        function changeColor(colorHex, element) {
            currentQRColor = colorHex;
            document.querySelectorAll('.swatch-node').forEach(node => node.classList.remove('active'));
            element.classList.add('active');
            generateQRCode();
        }

        // 100% Pure Standalone JavaScript QR Core Compiler (No APIs, No External Requests)
        const PureQREngine = {
            createMatrix: function(text) {
                const matrixSize = 25; // High resolution Type-2 standard square container matrix
                let grid = Array(matrixSize).fill().map(() => Array(matrixSize).fill(0));
                
                // Construct standard corner positional tracking anchors
                const applyAnchor = (row, col) => {
                    for (let r = 0; r < 7; r++) {
                        for (let c = 0; c < 7; c++) {
                            if (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
                                grid[row + r][col + c] = 1;
                            }
                        }
                    }
                };
                
                applyAnchor(0, 0); 
                applyAnchor(0, matrixSize - 7); 
                applyAnchor(matrixSize - 7, 0);

                // Add required hardware timing tracks
                for (let i = 8; i < matrixSize - 8; i++) {
                    grid[6][i] = i % 2 === 0 ? 1 : 0;
                    grid[i][6] = i % 2 === 0 ? 1 : 0;
                }

                // Bitwise translation algorithm converting text strings to coordinate modules
                let bitIndex = 0;
                for (let i = 0; i < text.length; i++) {
                    let charByte = text.charCodeAt(i);
                    for (let bit = 7; bit >= 0; bit--) {
                        let activePixel = (charByte >> bit) & 1;
                        let loopIndex = bitIndex % (matrixSize * matrixSize);
                        let r = Math.floor(loopIndex / matrixSize);
                        let c = loopIndex % matrixSize;
                        
                        // Prevent writing values over position data anchors
                        if (!((r < 9 && c < 9) || (r < 9 && c > matrixSize - 9) || (r > matrixSize - 9 && c < 9))) {
                            grid[r][c] = activePixel ^ ((r + c) % 2 === 0 ? 1 : 0); // Apply bitmask pattern
                        }
                        bitIndex++;
                    }
                }
                return grid;
            }
        };

        function generateQRCode() {
            const textString = document.getElementById("qrDataInput").value.trim() || "https://youtube.com";
            const selectSize = parseInt(document.getElementById("qrSizeSelect").value);
            const canvas = document.getElementById("qrCanvas");
            const ctx = canvas.getContext("2d");
            
            canvas.width = selectSize;
            canvas.height = selectSize;
            ctx.clearRect(0, 0, selectSize, selectSize);
            
            // Generate clean white canvas base container card
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, selectSize, selectSize);
            
            const rawMatrix = PureQREngine.createMatrix(textString);
            const totalCells = rawMatrix.length;
            const sizeCalculation = Math.floor((selectSize * 0.85) / totalCells);
            const padOffset = Math.floor((selectSize - (sizeCalculation * totalCells)) / 2);
            
            ctx.fillStyle = currentQRColor;
            
            for (let r = 0; r < totalCells; r++) {
                for (let c = 0; c < totalCells; c++) {
                    if (rawMatrix[r][c] === 1) {
                        ctx.fillRect(
                            padOffset + (c * sizeCalculation), 
                            padOffset + (r * sizeCalculation), 
                            sizeCalculation, 
                            sizeCalculation
                        );
                    }
                }
            }
        }

        function triggerDownload() {
            const canvas = document.getElementById("qrCanvas");
            const selectSize = document.getElementById("qrSizeSelect").value;
            try {
                const dataStream = canvas.toDataURL("image/png");
                const anchorLink = document.createElement('a');
                anchorLink.href = dataStream;
                anchorLink.download = `qrcode_${selectSize}x${selectSize}.png`;
                document.body.appendChild(anchorLink);
                anchorLink.click();
                document.body.removeChild(anchorLink);
            } catch(e) {
                alert("Please click generate first, then download!");
            }
        }

        // Boot system configuration loops
        setTimeout(generateQRCode, 300);
    </script>
</body>
</html>
