<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - Premium Purple</title>
    <!-- Built-in high speed canvas calculation script compiler wrapper -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            background: radial-gradient(circle, #2d124d 0%, #0d041a 100%);
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-window {
            background-color: #1a0b2e;
            width: 820px;
            height: 520px;
            border-radius: 36px;
            display: flex;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            border: 1px solid #361f52;
            padding: 40px;
            box-sizing: border-box;
            gap: 40px;
        }
        .window-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .color-header-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }
        .color-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #a78bfa;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .color-swatch-box {
            display: flex;
            gap: 15px;
        }
        .swatch-node {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .swatch-node.white { background-color: #ffffff; border-color: #ffffff; }
        .swatch-node.dark { background-color: #0d041a; border-color: #361f52; }
        
        .qr-stage-container {
            width: 310px;
            height: 310px;
            background-color: #ffffff;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            overflow: hidden;
            padding: 30px;
            box-sizing: border-box;
        }
        /* Lock calculation tree directly into canvas layer layout rules */
        .qr-stage-container img, .qr-stage-container canvas {
            width: 250px !important;
            height: 250px !important;
            display: block;
        }
        .btn-download-trigger {
            width: 100%;
            background-color: #7c3aed;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
            text-align: center;
        }
        .btn-download-trigger:hover { background-color: #6d28d9; }

        .window-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
        }
        .logo-branding-area {
            text-align: left;
            margin-top: 10px;
            margin-bottom: 40px;
        }
        .logo-text-main {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 0;
            line-height: 1;
        }
        .logo-text-sub {
            font-size: 13px;
            letter-spacing: 5px;
            color: #a78bfa;
            text-transform: uppercase;
            margin: 4px 0 0 2px;
            font-weight: 600;
        }
        .form-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 24px;
        }
        .field-label {
            font-size: 13px;
            font-weight: 600;
            color: #a78bfa;
        }
        .text-input-field {
            width: 100%;
            padding: 14px 18px;
            background-color: #25123e;
            border: 1px solid #3d2361;
            color: #ffffff;
            border-radius: 14px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .text-input-field::placeholder { color: #5c3f85; }
        .text-input-field:focus { border-color: #7c3aed; outline: none; }
        
        .btn-generate-action {
            background-color: #8b5cf6;
            color: #ffffff;
            border: none;
            padding: 14px 36px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: fit-content;
            align-self: center;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .btn-generate-action:hover { background-color: #7c3aed; }
        
        .github-anchor-icon {
            position: absolute;
            bottom: 5px;
            right: 5px;
            color: #a78bfa;
            font-size: 22px;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="app-window">
        <div class="window-left">
            <div class="color-header-row">
                <div class="color-title">Set Color</div>
                <div class="color-swatch-box">
                    <div class="swatch-node white"></div>
                    <div class="swatch-node dark"></div>
                </div>
            </div>
            
            <!-- Target sandbox injection node slot -->
            <div class="qr-stage-container" id="qrcode_canvas"></div>
            
            <button type="button" class="btn-download-trigger" onclick="triggerDownload()">Download</button>
        </div>

        <div class="window-right">
            <div class="logo-branding-area">
                <div class="logo-text-main">QRcode</div>
                <div class="logo-text-sub">generator</div>
            </div>

            <div class="form-input-group">
                <label class="field-label">Submit URL or text</label>
                <input type="text" class="text-input-field" id="qrDataInput" placeholder="Enter text or URL here" value="https://youtube.com">
            </div>

            <div class="form-input-group">
                <label class="field-label">Image size</label>
                <input type="text" class="text-input-field" style="text-align: center; color: #a78bfa; font-weight: bold;" value="300x300" readonly>
            </div>

            <button type="button" class="btn-generate-action" onclick="generateQRCode()">Generate</button>

            <a href="https://github.com" target="_blank" class="github-anchor-icon">
                <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 16 16" height="1em" width="1em" xmlns="http://w3.org"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
            </a>
        </div>
    </div>

    <script>
        let stageBox = document.getElementById("qrcode_canvas");
        let activeInstance = null;

        function generateQRCode() {
            let userString = document.getElementById("qrDataInput").value.trim();
            if(!userString) return;

            // Purge old DOM branch node mappings completely
            stageBox.innerHTML = "";
            
            // Re-render local vector mapping structure instantly
            activeInstance = new QRCode(stageBox, {
                text: userString,
                width: 250,
                height: 250,
                colorDark : "#1a0b2e",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        function triggerDownload() {
            // Pull safe base64 stream directly from target layout element tree 
            const finalImg = stageBox.querySelector('img');
            const targetCanvas = stageBox.querySelector('canvas');
            
            let sourceUrl = "";
            if (finalImg && finalImg.src && finalImg.src.startsWith('data:')) {
                sourceUrl = finalImg.src;
            } else if (targetCanvas) {
                sourceUrl = targetCanvas.toDataURL("image/png");
            }

            if (sourceUrl) {
                const triggerLink = document.createElement('a');
                triggerLink.href = sourceUrl;
                triggerLink.download = 'premium_purple_qr.png';
                document.body.appendChild(triggerLink);
                triggerLink.click();
                document.body.removeChild(triggerLink);
            } else {
                alert("Please input text and generate a code first!");
            }
        }

        // Automatic generation loop run when document finishes compilation
        setTimeout(generateQRCode, 300);
    </script>
</body>
</html>
