<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - Premium Purple</title>
    <style>
        body {
            background: radial-gradient(circle, #2d124d 0%, #0d041a 100%) !important;
            color: #ffffff !important;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif !important;
            margin: 0 !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            min-height: 100vh !important;
        }
        .app-window {
            background-color: #1a0b2e !important;
            width: 820px !important;
            height: 520px !important;
            border-radius: 36px !important;
            display: flex !important;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6) !important;
            overflow: hidden !important;
            border: 1px solid #361f52 !important;
            padding: 40px !important;
            box-sizing: border-box !important;
            gap: 40px !important;
        }
        .window-left {
            flex: 1 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
        }
        .color-header-row {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            margin-bottom: 25px !important;
        }
        .color-title {
            font-size: 11px !important;
            font-weight: 700 !important;
            letter-spacing: 2.5px !important;
            color: #a78bfa !important;
            text-transform: uppercase !important;
            margin-bottom: 10px !important;
        }
        .color-swatch-box {
            display: flex !important;
            gap: 15px !important;
        }
        .swatch-node {
            width: 32px !important;
            height: 32px !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            border: 2px solid transparent !important;
        }
        .swatch-node.white { background-color: #ffffff !important; border-color: #7c3aed !important; }
        .swatch-node.dark { background-color: #0d041a !important; border-color: #361f52 !important; }
        .swatch-node.active { border-color: #00ffcc !important; box-shadow: 0 0 10px #00ffcc !important; }
        
        .qr-stage-container {
            width: 310px !important;
            height: 310px !important;
            background-color: #ffffff !important;
            border-radius: 24px !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-bottom: 25px !important;
            overflow: hidden !important;
        }
        .qr-stage-container canvas {
            width: 250px !important;
            height: 250px !important;
            display: block !important;
        }
        .btn-download-trigger {
            width: 100% !important;
            background-color: #7c3aed !important;
            color: #ffffff !important;
            border: none !important;
            padding: 16px !important;
            border-radius: 16px !important;
            font-size: 16px !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            letter-spacing: 0.5px !important;
            text-align: center !important;
        }
        .window-right {
            flex: 1 !important;
            display: flex !important;
            flex-direction: column !important;
            box-sizing: border-box !important;
            position: relative !important;
        }
        .logo-branding-area {
            text-align: left !important;
            margin-top: 10px !important;
            margin-bottom: 40px !important;
        }
        .logo-text-main {
            font-size: 38px !important;
            font-weight: 700 !important;
            color: #ffffff !important;
            margin: 0 !important;
        }
        .logo-text-sub {
            font-size: 13px !important;
            letter-spacing: 5px !important;
            color: #a78bfa !important;
            text-transform: uppercase !important;
            margin-top: 4px !important;
        }
        .form-input-group {
            display: flex !important;
            flex-direction: column !important;
            gap: 6px !important;
            margin-bottom: 24px !important;
        }
        .field-label {
            font-size: 13px !important;
            font-weight: 600 !important;
            color: #a78bfa !important;
        }
        .text-input-field {
            width: 100% !important;
            padding: 14px 18px !important;
            background-color: #25123e !important;
            border: 1px solid #3d2361 !important;
            color: #ffffff !important;
            border-radius: 14px !important;
            font-size: 14px !important;
            box-sizing: border-box !important;
        }
        .btn-generate-action {
            background-color: #8b5cf6 !important;
            color: #ffffff !important;
            border: none !important;
            padding: 14px 36px !important;
            border-radius: 20px !important;
            font-size: 14px !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            width: fit-content !important;
            align-self: center !important;
        }
        .github-anchor-icon {
            position: absolute !important;
            bottom: 5px !important;
            right: 5px !important;
            color: #a78bfa !important;
            font-size: 22px !important;
        }
    </style>
</head>
<body>

    <div class="app-window">
        <div class="window-left">
            <div class="color-header-row">
                <div class="color-title">Set Color</div>
                <div class="color-swatch-box">
                    <div class="swatch-node white active" onclick="changeColor('#1a0b2e', this)"></div>
                    <div class="swatch-node dark" onclick="changeColor('#0d041a', this)"></div>
                </div>
            </div>
            
            <div class="qr-stage-container">
                <canvas id="qrCanvas"></canvas>
            </div>
            
            <button type="button" class="btn-download-trigger" onclick="triggerDownload()">Download</button>
        </div>

        <div class="window-right">
            <div class="logo-branding-area">
                <div class="logo-text-main">QRcode</div>
                <div class="logo-text-sub">generator</div>
            </div>

            <div class="form-input-group">
                <label class="field-label">Submit URL or text</label>
                <input type="text" class="text-input-field" id="qrDataInput" placeholder="Enter text or URL here" value="https://youtube.com">
            </div>

            <div class="form-input-group">
                <label class="field-label">Image size</label>
                <select class="text-input-field" id="qrSizeSelect" onchange="generateQRCode()" style="cursor: pointer;">
                    <option value="200">200x200</option>
                    <option value="300" selected>300x300</option>
                    <option value="400">400x400</option>
                    <option value="500">500x500</option>
                </select>
            </div>

            <button type="button" class="btn-generate-action" onclick="generateQRCode()">Generate</button>

            <a href="https://github.com" target="_blank" class="github-anchor-icon">
                <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 16 16" height="1em" width="1em" xmlns="http://w3.org"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
            </a>
        </div>
    </div>

    <script>
        let currentQRColor = "1a0b2e";

        function changeColor(color, element) {
            currentQRColor = color.replace('#', '');
            document.querySelectorAll('.swatch-node').forEach(node => node.classList.remove('active'));
            element.classList.add('active');
            generateQRCode();
        }

        function generateQRCode() {
            const dataString = document.getElementById("qrDataInput").value.trim() || "https://youtube.com";
            const selectSize = parseInt(document.getElementById("qrSizeSelect").value);
            const canvas = document.getElementById("qrCanvas");
            
            canvas.width = selectSize;
            canvas.height = selectSize;
            
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, selectSize, selectSize);
            
            const apiEndpoint = `https://qrserver.com{selectSize}x${selectSize}&data=${encodeURIComponent(dataString)}&color=${currentQRColor}&margin=10`;
            
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = apiEndpoint;
            img.onload = function() {
                ctx.drawImage(img, 0, 0, selectSize, selectSize);
            };
        }

        function triggerDownload() {
            const canvas = document.getElementById("qrCanvas");
            const selectSize = document.getElementById("qrSizeSelect").value;
            try {
                const urlStream = canvas.toDataURL("image/png");
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = urlStream;
                downloadAnchor.download = `qrcode_${selectSize}x${selectSize}.png`;
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                document.body.removeChild(downloadAnchor);
            } catch(e) {
                alert("Please click generate first, then try downloading!");
            }
        }

        setTimeout(generateQRCode, 400);
    </script>
</body>
</html>
